<script>
document.addEventListener("DOMContentLoaded", function () {

  function showRelease() {
    {% if release_to_show %}
      Swal.fire({
        title: 'Welcome to {{ release_to_show.version|escapejs }}',
        html: `
          <div style="text-align: left; font-size: 1.05rem;">
            <p><strong>Release Date:</strong> {{ release_to_show.release_date|date:"F j, Y"|escapejs }}</p>
            <hr style="margin: 1.2rem 0;">
            
            <h6 style="margin-bottom: 0.6rem; color: #1e40af;">New Features</h6>
            <div style="white-space: pre-wrap; line-height: 1.6;">
              {{ release_to_show.features|default:"No new features listed."|escapejs }}
            </div>
            
            <hr style="margin: 1.2rem 0;">
            
            <h6 style="margin-bottom: 0.6rem; color: #047857;">Bug Fixes & Improvements</h6>
            <div style="white-space: pre-wrap; line-height: 1.6;">
              {{ release_to_show.bug_fixes|default:"No fixes in this release."|escapejs }}
            </div>
          </div>
        `,
        icon: 'success',
        confirmButtonText: 'Got it!',
        confirmButtonColor: '#10b981',
        background: '#ecfdf5',
        padding: '2rem',
      });
    {% endif %}
  }

  function showAnnouncement() {
    {% if announcement %}
      Swal.fire({
        title: "{{ announcement.title|escapejs }}",
        html: `
          <div style="text-align: left; white-space: pre-wrap; line-height: 1.6; font-size: 1.05rem;">
            {{ announcement.body|escapejs }}
          </div>
        `,
        icon: 'info',
        confirmButtonText: 'Got it',
        confirmButtonColor: '#3b82f6',
        background: '#fffbeb',
        padding: '2rem',
        allowOutsideClick: false,
        allowEscapeKey: false,
        allowEnterKey: true,
      }).then(() => {
        // Small delay so the second popup doesn't feel too abrupt
        setTimeout(showRelease, 400);
      });
    {% else %}
      showRelease();
    {% endif %}
  }

  // Start the flow
  showAnnouncement();

});
</script><script>
document.addEventListener("DOMContentLoaded", function () {

  const isMobile = window.innerWidth < 576;

        setTimeout(showRelease, 300);
      });
    {% else %}
      showRelease();
    {% endif %}
  }

  // Start the sequence
  showAnnouncement();

});
</script>
