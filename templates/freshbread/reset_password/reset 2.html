{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset Password - Step 2 - Kingfood</title>
<link rel="icon" type="image/png" href="{% static 'images/favicon.ico' %}" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; font-family: "Roboto", sans-serif; }

body {
    margin: 0; padding: 0; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(circle at top left, rgba(255, 96, 219, 0.40), transparent 45%),
                radial-gradient(circle at bottom right, rgba(86, 191, 255, 0.40), transparent 45%),
                linear-gradient(135deg, #142050, #1a2b63, #1f3a7a);
    background-size: cover; background-attachment: fixed; overflow: hidden;
}

/* Progress Bar */
#progress-bar {
    position: fixed; top: 0; left: 0; width: 0%; height: 3px;
    background: linear-gradient(90deg, #ff45c4, #6bc7ff);
    z-index: 10000; box-shadow: 0 0 8px rgba(255, 69, 196, 0.6);
    transition: width 0.4s ease;
}

/* Return to Home */
.return-home {
    position: absolute; top: 20px; left: 20px;
    display: flex; align-items: center; gap: 8px;
    color: #fff; background: rgba(255,255,255,0.1);
    padding: 10px 16px; border-radius: 50px; text-decoration: none;
    font-size: 14.5px; backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    transition: 0.3s; z-index: 100;
}
.return-home:hover { background: rgba(255,255,255,0.25); transform: translateX(-5px); }

@media (max-width: 576px) {
    .return-home { padding: 12px; border-radius: 50%; }
    .return-home span { display: none; }
}

/* Card */
.login-card {
    position: relative; width: 100%; max-width: 420px; padding: 45px 40px;
    border-radius: 22px; background: rgba(39, 44, 85, 0.5);
    backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
    animation: fadeIn 0.7s ease; margin: 20px;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

h2 {
    text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 30px;
    background: linear-gradient(90deg, #ff43c1, #7acbff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* Inputs */
.form-group { position: relative; margin-bottom: 22px; }
.form-group i {
    position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
    color: #c8d2e0; font-size: 17px;
}
.form-group input {
    width: 100%; padding: 15px 16px 15px 48px;
    background: rgba(255,255,255,0.08); border: none;
    border-radius: 12px; font-size: 15px; color: #fff; outline: none;
}
.form-group input:focus {
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 12px rgba(110,180,255,0.45);
}

/* Submit Button */
.btn-submit {
    width: 100%; padding: 15px; margin-top: 8px; border-radius: 14px;
    border: none; background: linear-gradient(90deg, #ff45c4, #6bc7ff);
    color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
    position: relative; overflow: hidden; display: flex;
    align-items: center; justify-content: center; gap: 10px;
    transition: 0.3s;
}
.btn-submit:hover { filter: brightness(1.15); transform: scale(1.03); }
.btn-submit.loading { pointer-events: none; filter: brightness(0.95); }
.btn-submit .spinner {
    width: 23px; height: 23px; border: 3.5px solid rgba(255,255,255,0.35);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.75s linear infinite;
    display: none;
}
.btn-submit.loading .spinner { display: block; }
.btn-submit.loading span { opacity: 0; visibility: hidden; width: 0; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Timer & Options */
.timer {
    text-align: center; color: #dfe4f1; margin-top: 20px; font-size: 15px;
}
.options {
    margin-top: 18px; display: flex; gap: 12px;
}
.options .btn-submit {
    flex: 1; padding: 13px; font-size: 15px;
}

/* Floating Dots */
.dot {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,0.08);
    filter: blur(4px); animation: float 6s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.d1 { width: 80px; height: 80px; top: -40px; left: -35px; }
.d2 { width: 55px; height: 55px; bottom: -30px; right: -25px; }
.d3 { width: 40px; height: 40px; top: 35%; right: -20px; }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4/animate.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<!-- Progress Bar -->
<div id="progress-bar"></div>

<!-- Return to Home -->
<a href="{% url 'index' %}" class="return-home">
    <i class="fas fa-arrow-left"></i>
    <span>Return to Home</span>
</a>

<div class="login-card">
    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>

    <h2>Enter Verification Code</h2>

    <form id="reset-form" method="POST" action="{% url 'reset_password_step2' %}">
        {% csrf_token %}
        <input type="hidden" name="username" value="{{ request.GET.username|default:'' }}">

        <div class="form-group">
            <i class="fa fa-key"></i>
            <input type="text" name="code" id="code" placeholder="Verification Code" required maxlength="6" autocomplete="off" />
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
            <span>Verify</span>
            <div class="spinner"></div>
        </button>
    </form>

    <div class="timer">Resend code in <span id="countdown">120</span>s</div>

    <div class="options">
        <button id="resend-btn" class="btn-submit" type="button">Resend Code</button>
        <button id="change-email-btn" class="btn-submit" type="button">Change Email</button>
    </div>
</div>

<script>
// Progress Bar
const progressBar = document.getElementById('progress-bar');
function startProgress() {
    progressBar.style.width = '0%';
    setTimeout(() => progressBar.style.width = '95%', 50);
}
document.querySelectorAll('a').forEach(link => link.addEventListener('click', startProgress));

// Form Handling
const form = document.getElementById('reset-form');
const submitBtn = document.getElementById('submit-btn');
let isSubmitting = false;

form.addEventListener('submit', function(e) {
    if (isSubmitting) {
        e.preventDefault();
        return;
    }
    isSubmitting = true;
    submitBtn.classList.add('loading');
});

// Extra Buttons
document.getElementById('resend-btn').addEventListener('click', startProgress);
document.getElementById('change-email-btn').addEventListener('click', startProgress);

// SweetAlert
{% if messages %}
document.addEventListener("DOMContentLoaded", function() {
    const messages = [
        {% for message in messages %}
        { text: "{{ message|escapejs }}", tag: "{{ message.tags }}" },
        {% endfor %}
    ];

    function getAlertColors(tag) {
        switch(tag) {
            case 'success': return { bg:'#22c55e', icon:'success' };
            case 'error':   return { bg:'#dc2626', icon:'error' };
            case 'warning': return { bg:'#facc15', icon:'warning' };
            default:        return { bg:'#3b82f6', icon:'info' };
        }
    }

    function showNext(index = 0) {
        if (index >= messages.length) return;
        const style = getAlertColors(messages[index].tag);
        Swal.fire({
            title: messages[index].text,
            icon: style.icon,
            background: style.bg,
            color: '#fff',
            timer: 6000,
            timerProgressBar: true,
            showConfirmButton: false,
            toast: window.innerWidth < 768 ? false : true,
            position: window.innerWidth < 768 ? 'center' : 'top-end',
        }).then(() => showNext(index + 1));
    }
    showNext();
});
{% endif %}
</script>

</body>
</html>
